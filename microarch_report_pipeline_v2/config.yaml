# === Microarchitecture Experiments Config ===

sim_path: "../sim"             # path to your compiled simulator binary
traces:
  - "../traces/gcc_trace.txt"  # default trace(s) to run when a sweep does not override them

arg_order: ["BLOCKSIZE","L1_SIZE","L1_ASSOC","L2_SIZE","L2_ASSOC","PREF_N","PREF_M","TRACE"]

# Sweeps aligned with report requirements (Graphs #1–#5 and Table #1)
sweeps:
  - name: graph1_size_assoc
    description: "Graph #1 #2 — vary L1 size & associativity, BLOCKSIZE=32, no L2/prefetch"
    params:
      BLOCKSIZE: [32]
      L1_SIZE:   [1024, 2048, 4096, 8192, 16384, 32768, 65536, 131072, 262144, 524288, 1048576]
      L1_ASSOC:  [1, 2, 4, 8, "FA"]
      L2_SIZE:   [0]
      L2_ASSOC:  [0]
      PREF_N:    [0]
      PREF_M:    [0]

  - name: graph3_l2
    description: "Graph #3 — add 16KB 8-way L2 while varying L1 size & assoc"
    params:
      BLOCKSIZE: [32]
      L1_SIZE:   [1024, 2048, 4096, 8192]
      L1_ASSOC:  [1, 2, 4, 8]
      L2_SIZE:   [16384]
      L2_ASSOC:  [8]
      PREF_N:    [0]
      PREF_M:    [0]

  - name: graph4_blocksize
    description: "Graph #4 — vary block size with L1 assoc = 4 (no L2/prefetch)"
    params:
      BLOCKSIZE: [16, 32, 64, 128]
      L1_SIZE:   [1024, 2048, 4096, 8192, 16384, 32768]
      L1_ASSOC:  [4]
      L2_SIZE:   [0]
      L2_ASSOC:  [0]
      PREF_N:    [0]
      PREF_M:    [0]

  - name: graph5_l2size
    description: "Graph #5 — vary L2 size (16/32/64KB) with L1 assoc = 4"
    params:
      BLOCKSIZE: [32]
      L1_SIZE:   [1024, 2048, 4096, 8192]
      L1_ASSOC:  [4]
      L2_SIZE:   [16384, 32768, 65536]
      L2_ASSOC:  [8]
      PREF_N:    [0]
      PREF_M:    [0]

  - name: stream_prefetch_disabled
    description: "Table #1 baseline — stream trace, prefetch disabled"
    traces:
      - "../traces/stream_trace.txt"
    params:
      BLOCKSIZE: [16]
      L1_SIZE:   [1024]
      L1_ASSOC:  [1]
      L2_SIZE:   [0]
      L2_ASSOC:  [0]
      PREF_N:    [0]
      PREF_M:    [0]

  - name: stream_prefetch_buffers
    description: "Table #1 — stream buffers N=1..4 with M=4"
    traces:
      - "../traces/stream_trace.txt"
    params:
      BLOCKSIZE: [16]
      L1_SIZE:   [1024]
      L1_ASSOC:  [1]
      L2_SIZE:   [0]
      L2_ASSOC:  [0]
      PREF_N:    [1, 2, 3, 4]
      PREF_M:    [4]

  - name: stream_prefetch_blk32
    description: "Table #1 Q3 — double block size with prefetch disabled"
    traces:
      - "../traces/stream_trace.txt"
    params:
      BLOCKSIZE: [32]
      L1_SIZE:   [1024]
      L1_ASSOC:  [1]
      L2_SIZE:   [0]
      L2_ASSOC:  [0]
      PREF_N:    [0]
      PREF_M:    [0]

figures:
  # Graph #1: L1 miss rate vs log2(L1 size); series = L1_ASSOC; BLK=32; NO L2/prefetch
  - name: graph1_L1_missrate_vs_log2L1_by_ASSOC
    title: "Graph #1 — L1 Miss Rate vs log2(L1 Size) by Associativity (gcc_trace)"
    x: log2_L1_SIZE
    y: L1_miss_rate
    series: assoc_label
    hold:
      trace: gcc.trace.txt     # matches CSV normalization (dots, not underscores)
      BLOCKSIZE: 32
      L2_SIZE: 0
      L2_ASSOC: 0
      PREF_N: 0
      PREF_M: 0

  # Graph #2: AAT vs log2(L1 size); same runs as #1 but exclude fully-associative
  - name: graph2_AAT_vs_log2L1_by_ASSOC_noFA
    title: "Graph #2 — AAT vs log2(L1 Size) by Associativity (no FA)"
    x: log2_L1_SIZE
    y: amat
    series: assoc_label
    hold:
      trace: gcc.trace.txt
      BLOCKSIZE: 32
      L2_SIZE: 0
      L2_ASSOC: 0
      PREF_N: 0
      PREF_M: 0

  # Graph #3: AAT vs log2(L1 size); L2 = 16KB, 8-way; BLK=32; L1 sizes 1..8KB
  - name: graph3_AAT_vs_log2L1_by_ASSOC_L2_16KB_8way
    title: "Graph #3 — AAT vs log2(L1 Size) with L2=16KB, 8-way"
    x: log2_L1_SIZE
    y: amat
    series: assoc_label
    hold:
      trace: gcc.trace.txt
      BLOCKSIZE: 32
      L2_SIZE: 16384
      L2_ASSOC: 8
      PREF_N: 0
      PREF_M: 0

  # Graph #4: L1 miss rate vs log2(BLOCKSIZE); series = L1_SIZE; A_L1=4; NO L2
  - name: graph4_L1_missrate_vs_log2BLOCK_by_L1SIZE_A4
    title: "Graph #4 — L1 Miss Rate vs log2(BLOCKSIZE) by L1 Size (A=4)"
    x: log2_BLOCKSIZE
    y: L1_miss_rate
    series: L1_SIZE
    hold:
      trace: gcc.trace.txt
      L1_ASSOC: 4
      L2_SIZE: 0
      L2_ASSOC: 0
      PREF_N: 0
      PREF_M: 0

  # Graph #5: AAT vs log2(L1 size); series = L2_SIZE; BLK=32; A_L1=4; A_L2=8
  - name: graph5_AAT_vs_log2L1_by_L2SIZE
    title: "Graph #5 — AAT vs log2(L1 Size) by L2 Size (A_L1=4, A_L2=8)"
    x: log2_L1_SIZE
    y: amat
    series: L2_SIZE
    hold:
      trace: gcc.trace.txt
      BLOCKSIZE: 32
      L1_ASSOC: 4
      L2_ASSOC: 8
      PREF_N: 0
      PREF_M: 0
